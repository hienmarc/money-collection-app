name: Deploy (Terraform + Supabase Migrations)

on:
  push:
    branches:
      - dev
      - main
      - actions-tests
      - env-modules
    paths:
      - "**.tf"
      - "supabase/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  detect-shared-changes:
    # Job to detect changes in shared Terraform modules to apply
    # shared infrastructure before environment-specific infrastructure.
    name: Detect changes in shared Terraform module
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      application: ${{ steps.filter.outputs.application }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'terraform/environments/shared/**'
              - 'terraform/modules/shared/**'
            

  terraform-shared:
    name: Terraform Apply (shared)
    needs: detect-shared-changes
    if: needs.detect-shared-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKING_DIR: ./terraform/environments/shared
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TFE_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_upstash_email: ${{ vars.UPSTASH_EMAIL }}
      TF_VAR_upstash_api_key: ${{ secrets.UPSTASH_API_KEY }}
      TF_VAR_redis_database_name: ${{ vars.REDIS_DATABASE_NAME }}
      TF_VAR_redis_region: ${{ vars.REDIS_REGION }}
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
      TF_VAR_vercel_project_name: ${{ vars.VERCEL_PROJECT_NAME }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.1"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

  terraform:
    name: Terraform Apply (environment)
    needs: [detect-shared-changes, terraform-shared]
    # Only run this job if either the shared infrastructure did not change 
    # or the shared Terraform apply was successful.
    if: >-
      ${{always() &&
        (needs.detect-shared-changes.outputs.shared != 'true' ||
         needs.terraform-shared.result == 'success')}}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }} 

    outputs:
      supabase_project_id: ${{ steps.tf_outputs.outputs.supabase_project_id }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKING_DIR: ./terraform/environments/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      # TF_TOKEN_ is used for Terraform Cloud authentication to save state in a remote workspace.
      # app_terraform_io is from the Terraform Cloud hostname (app.terraform.io).
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TFE_TOKEN: ${{ secrets.TF_API_TOKEN }}

      # TF_VAR_ prefix directly maps env variable to Terraform variable
      TF_VAR_github_repo: "${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}"
      ## AWS variables
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_aws_resource_prefix: ${{ vars.AWS_RESOURCE_PREFIX }}
      ## Supabase variables
      TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_VAR_supabase_organization_id: ${{ vars.SUPABASE_ORGANIZATION_ID }}
      TF_VAR_supabase_project_name: ${{ vars.SUPABASE_PROJECT_NAME }}
      TF_VAR_supabase_database_password: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TF_VAR_supabase_region: ${{ vars.SUPABASE_REGION }}
      ## Upstash variables
      TF_VAR_upstash_email: ${{ vars.UPSTASH_EMAIL }}
      TF_VAR_upstash_api_key: ${{ secrets.UPSTASH_API_KEY }}
      TF_VAR_redis_database_name: ${{ vars.REDIS_DATABASE_NAME }}
      TF_VAR_redis_region: ${{ vars.REDIS_REGION }}
      ## Vercel variables
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
      TF_VAR_vercel_project_name: ${{ vars.VERCEL_PROJECT_NAME }}
      ## Third-party API keys
      TF_VAR_numista_api_key: ${{ secrets.NUMISTA_API_KEY }}
      TF_VAR_exchangerates_api_key: ${{ secrets.EXCHANGERATES_API_KEY }}
      TF_VAR_rest_countries_api_key: ${{ secrets.REST_COUNTRIES_API_KEY }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.1"

      - name: Terraform Init
        run: terraform init -input=false
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -out=tfplan
        continue-on-error: false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read Terraform outputs
        id: tf_outputs
        run: echo "supabase_project_id=$(terraform output -raw supabase_project_id)" >> "$GITHUB_OUTPUT"

      - name: Archive plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 30

  supabase-push-migrations:
    name: Supabase Push Migrations
    needs: terraform
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ needs.terraform.outputs.supabase_project_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        run: supabase db push
